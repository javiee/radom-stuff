- name: Create root folder
  ansible.builtin.file:
    path: "{{ webserver_nginx_root_folder }}"
    state: directory
    mode: '0755'
  tags: install

- name: Set up Nginx default site
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ webserver_nginx_sites_enabled }}/{{ item.server_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx
  with_items:
    - "{{ webserver_vhosts }}"
  tags: 
    - vhost

- name: Deploys default site
  ansible.builtin.copy:
    src: files/index.html
    dest: "{{ webserver_nginx_root_folder }}"
    mode: '0644'
  tags: 
    - vhost
